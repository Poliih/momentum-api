server:
  port: 8080

spring:
  application:
    name: momentum-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/momentum}
    username: ${DATABASE_USERNAME:momentum}
    password: ${DATABASE_PASSWORD:momentum}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

momentum:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please-min-32-bytes}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 dias
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.momentum.api: INFO
